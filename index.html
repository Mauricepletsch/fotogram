<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotogram</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./templates.js"></script>
    <script src="./script.js"></script>
</head>

<body onload="render()">
    <header>
        <div class="content">
                <img class="logo" src="./img/icons/logo.png" alt="Fotogram">
        </div>
    </header>

    <main>
        <h1 class="headline">Your personal photo album</h1>
        <section id="gallery" class="gallery content"></section>

        <div id="overlay" class="overlay d_none" onclick="closeOverlay()">
    <div class="overlay_content" onclick="event.stopPropagation()">
        <div class="overlay_header">
            <h2 id="overlay_title" class="overlay_title"></h2>
            <button class="overlay_close" onclick="closeOverlay()">X</button>
        </div>
        <img id="overlay_photo" class="overlay_photo" src="" alt="">
        <div class="overlay_buttons">
            <button onclick="previousPhoto()">←</button>
            <p id="overlay_counter"></p>
            <button onclick="nextPhoto()">→</button>
        </div>
    </div>
</div>
    </main>

    <footer class="footer">
        <div class="content footer_content">
            <img class="logo_da" src="./img/icons/logo-da.png" alt="Developer Akademie">
            <p class="footer_text">© 2023 Developer Akademie GmbH</p>
        </div>
    </footer>
</body>

</html>
